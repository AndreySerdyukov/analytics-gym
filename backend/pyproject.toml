[project]
name = "analytics-gym-backend"
version = "0.1.0"
description = "Backend тренажёра для подготовки к собеседованиям DA/DS (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
# Приложение, не библиотека: сам проект в .venv не устанавливаем.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
